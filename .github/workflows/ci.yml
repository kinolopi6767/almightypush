name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test:unit

      - name: Security audit
        # Gate on high/critical only: moderate advisories in the UI-only
        # dependency tree must not block panel releases, but high+ must.
        run: pnpm audit --prod --audit-level=high

      - name: Build
        run: pnpm build

      - name: SDK bundle is not stale
        # The committed public SDK must match packages/sdk-client sources.
        run: git diff --exit-code -- apps/web/public/sdk/pushpanel-sdk.js

      - name: PHP syntax (WordPress plugin)
        run: php -l plugins/wordpress/pushpanel.php

      - name: Commitlint (PR range)
        if: github.event_name == 'pull_request'
        run: npx --yes @commitlint/cli@19 --config .commitlintrc.cjs --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  docker:
    name: Docker build + compose config + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build image (same Dockerfile Coolify deploys)
        run: docker build -t pushpanel:ci .

      - name: Validate compose topology
        env:
          APP_URL: http://localhost:3000
          APP_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          AUTH_SECRET: cismoketest-secret-cismoketest-secret
        run: docker compose config --quiet && echo "compose config OK"

      - name: Container smoke test (health + ready + non-root)
        run: |
          docker run -d --name pp-ci \
            -e NODE_ENV=production \
            -e APP_URL=http://127.0.0.1:3000 \
            -e APP_ENC_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e AUTH_SECRET=cismoketest-secret-cismoketest-secret \
            -p 3000:3000 pushpanel:ci
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then echo "health never came up"; docker logs pp-ci; exit 1; fi
          curl -fsS http://127.0.0.1:3000/api/health/ready >/dev/null
          # The entrypoint drops PID 1 to the `app` user (uid 1001) via su-exec:
          # verify the web server itself is not running as root.
          uid="$(docker exec pp-ci sh -c "grep '^Uid:' /proc/1/status | awk '{print \$2}'")"
          test "$uid" = "1001" || { echo "PID 1 is not running as app (uid=$uid)"; exit 1; }
          docker rm -f pp-ci

  e2e:
    name: E2E (playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @pushpanel/web exec playwright install --with-deps chromium

      - name: Build (web + worker + packages)
        run: pnpm build

      - name: Run E2E smoke
        env:
          AUTH_SECRET: smokestest-secret-smokestest-secret
          APP_ENC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: pnpm --filter @pushpanel/web test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7