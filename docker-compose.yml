services:
  web:
    build: .
    container_name: pushpanel-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_PATH: /app/data/pushpanel.db
      APP_ENC_KEY: ${APP_ENC_KEY:?set APP_ENC_KEY}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_NAME: ${OWNER_NAME:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      # 1M scale: tune for VPS RAM — AWS t2.micro 1GB → 64MB, 2GB+ VPS → 256MB
      SQLITE_CACHE_MB: ${SQLITE_CACHE_MB:-64}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-500}
      SCHEDULER_CHUNK: ${SCHEDULER_CHUNK:-500}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MAX_SUBSCRIBERS_PER_DOMAIN: ${MAX_SUBSCRIBERS_PER_DOMAIN:-}
    volumes:
      - pushdata:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Same image; the worker process runs the sender/scheduler loop
  # against the shared volume. One writer + concurrent readers = WAL-safe.
  worker:
    build: .
    container_name: pushpanel-worker
    restart: unless-stopped
    command: ["node", "./worker/index.mjs"]
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_PATH: /app/data/pushpanel.db
      APP_ENC_KEY: ${APP_ENC_KEY:?set APP_ENC_KEY}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      SQLITE_CACHE_MB: ${SQLITE_CACHE_MB:-64}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-500}
      SCHEDULER_CHUNK: ${SCHEDULER_CHUNK:-500}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - pushdata:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Litestream continuous backup to R2/S3 for ephemeral free tiers (Render/Koyeb) or 1M extra safety
  # Uncomment and set R2_ vars to enable. Keeps SQLite durable even if volume is lost.
  # litestream:
  #   image: litestream/litestream:0.3.13
  #   restart: unless-stopped
  #   volumes:
  #     - pushdata:/app/data
  #     - ./litestream.yml:/etc/litestream.yml:ro
  #   environment:
  #     LITESTREAM_S3_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  #     LITESTREAM_S3_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  #   command: replicate

volumes:
  pushdata: